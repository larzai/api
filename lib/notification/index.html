<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyraxis Test</title>
</head>

<body>

  <div class="buttons">
    <button onclick="tes()">Log</button>
    <button onclick="tes2()">Info</button>
    <button onclick="tes3()">Confirm</button>
    <button onclick="tes4()">Prompt</button>
    <button onclick="tes5()">Toast</button>
  </div>

  <script src="./script.js"></script>

  <script>
    lyn.setLang("id");
    lyn.soundNotification("allow");

    function tes() {
      lyn.log({
        Status: "default",
        Mess: "Hai"
      });
    }

    function tes2() {
      lyn.info({
        Mess: "Teks",
        title: "Coba"
      });
    }

    function tes3() {
      lyn.confirm({
        Mess: "Yakin ingin melanjutkan?",
        Event: function() {
          lyn.info({
            Mess: "Telah diklik"
          });
        }
      });
    }

    async function tes4() {
      try {
        const a = await lyn.prompt({
          Mess: "Masukkan nomor:",
          Type: "num"
        });

        lyn.log({
          Mess: a >= 50
            ? "Nilai lebih dari 50."
            : "Nilai untuk Pak Prabowo: 11/100."
        });
      } catch (err) {
        lyn.log({
          Mess: "User membatalkan prompt",
          Status: "er"
        });
      }
    }
    
    function tes5() {
      lyn.toast({
        Title: "Pemberitahuan",
        Mess: "Ini toast biasa, hilang 5 detik",
        Status: "default"
      });
      
      lyn.toast({
        Title: "Berhasil!",
        Mess: "Data berhasil disimpan ke database.",
        Status: "success"
      });
      
      lyn.toast({
        Title: "Gagal Menyimpan",
        Mess: "Koneksi terputus.",
        Status: "error",
        Permanent: true
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #16191f;
      font-family: Arial, sans-serif;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 9px 15px;
      border: 1px solid #30353e;
      border-radius: 7px;
      background: #20242c;
      color: #c9ced8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }

    button:hover {
      border-color: #23a982;
      background: #252b33;
      color: #d8eee7;
    }

    button:active {
      transform: scale(.97);
    }
  </style>

</body>
</html>
